[project]
name = "pygame-ai-platformer"
version = "0.1.0"
description = "Pygame製マリオ風2Dプラットフォーマー + AI実験環境"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.scripts]
play = "pygame_ai_platformer.main:main"
ai-demo = "pygame_ai_platformer.ai_demo:main"
collect-data = "pygame_ai_platformer.collect_data:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pygame_ai_platformer"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]
